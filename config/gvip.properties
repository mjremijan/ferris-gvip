# GVIP configuration template

# Where are the videos to upload located?
video.rootDirectory=D:\\Videos\\YouTube channel

# Where to store the upload state file (created automatically)
state.file=D:\\Videos\\YouTube channel\\ferris-gvip\\upload-state.json

# Set to true to log the full processing flow without uploading to YouTube or persisting the state
youtube.dryRun=true

# Path to Google client secrets JSON file downloaded from Google Cloud Console
youtube.credentialsFile=D:\\Videos\\YouTube channel\\ferris-gvip\\client_secrets.json

# Path to the Google client OAuth tokens (created automatically)
oauth.tokensDir=D:\\Videos\\YouTube channel\\ferris-gvip

# A file containing a list of regular expressions for files to ignore. 
# Each line is a regex pattern. 
# If a file name matches any of the patterns, it will be ignored and not uploaded. 
# This is useful for excluding certain files from the upload process.
ignore.file=D:\\Videos\\YouTube channel\\ferris-gvip\\ignore.txt
